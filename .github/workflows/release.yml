name: release

# 打 tag（如 v1.2.0）时自动构建自包含单文件 exe 并发布 Release。
# 使用自包含模式是为了让用户下载即用，无需预装 .NET 8 桌面运行时。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签（例如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动补发时必须检出目标 tag：默认会检出默认分支，
          # 会把“分支代码”打上输入的 tag 发布，造成 tag 与二进制错位
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src/MonitorSwitch/MonitorSwitch.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Rename artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $tag = "${{ inputs.tag }}" }
          Rename-Item publish/MonitorSwitch.exe "MonitorSwitch-$tag-win-x64.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: MonitorSwitch ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: publish/MonitorSwitch-*-win-x64.exe
          body: |
            ## 下载

            下载下方的 `MonitorSwitch-*-win-x64.exe`，双击即可运行，**无需安装 .NET 运行时**（自包含单文件，约 65 MB）。

            - 首次启动会解压到临时目录，约需数秒；之后启动更快。
            - 若 SmartScreen 提示未知发布者，选择"更多信息 → 仍要运行"（本项目未做代码签名）。
            - 静默启动（只驻留托盘）：`MonitorSwitch.exe --minimized`

            ## 功能

            - 把显示器排列与参数（分辨率 / 刷新率 / 方向 / HDR / 拓扑）保存为**模板**
            - 托盘面板或**全局快捷键**一键切换
            - 显示器页改动采用**草稿模式**，需手动点"应用"，避免屏幕反复闪烁
            - 应用后 15 秒内未确认自动回滚

            完整说明见 [README](https://github.com/${{ github.repository }}#readme)。

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: MonitorSwitch-win-x64
          path: publish/MonitorSwitch-*-win-x64.exe
